# Save this file in your 10sandeep/10sandeep repo at:
#   .github/workflows/snake.yml
#
# It builds the contribution-snake SVGs and pushes them to an "output" branch,
# which the README reads from. Runs every 12 hours, on push, or manually.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a855f7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a855f7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
